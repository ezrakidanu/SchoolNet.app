name: Build SchoolNet Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: Optional HTTPS FastAPI base URL (or configure repository variable SCHOOLNET_API_BASE_URL)
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: frontend

      - name: Analyze Flutter source
        run: flutter analyze
        working-directory: frontend

      - name: Test Flutter source
        run: flutter test
        working-directory: frontend

      - name: Build Android APK
        working-directory: frontend
        env:
          API_BASE_URL: ${{ inputs.api_base_url || vars.SCHOOLNET_API_BASE_URL }}
        run: |
          if [[ -n "$API_BASE_URL" ]]; then
            case "$API_BASE_URL" in
              https://*) ;;
              *) echo "API_BASE_URL must use HTTPS for a release APK." >&2; exit 1 ;;
            esac
            flutter build apk --release --dart-define="API_BASE_URL=$API_BASE_URL"
          else
            flutter build apk --release
          fi

      - name: Upload app-release.apk
        uses: actions/upload-artifact@v4
        with:
          name: schoolnet-app-release-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build demo-mode APK
        run: flutter build apk --release --dart-define=SCHOOLNET_DEMO_MODE=true
        working-directory: frontend

      - name: Upload demo app-release.apk
        uses: actions/upload-artifact@v4
        with:
          name: schoolnet-app-demo-apk
          path: frontend/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
